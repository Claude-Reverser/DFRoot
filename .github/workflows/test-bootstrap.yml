name: Host validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  host-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Bootstrap filesystem tests
        run: sh tests/run.sh

      - name: Java logging tests
        run: sh tests/run-java.sh

      - name: Process runner tests
        run: sh tests/run-process.sh

      - name: Native safety tests
        run: sh tests/run-native-safety.sh

      - name: Log collector tests
        run: python3 -m unittest discover -s tests -p 'test_collect_logs.py'
